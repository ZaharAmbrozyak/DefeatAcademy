{% extends "academy/base.html" %}

{% block content %}

{% if form.errors %}
    <p>Дані не співпадають</p>
{% endif %}

<form method="post" action="{% url 'users:login' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button name="submit">Log in</button>
    <input type="hidden" name="next" value="{% url 'academy:index' %}" />
</form>

{% endblock content %}
