<head>
    <meta charset="UTF-8">
</head>

<h1><a href="{% url 'academy:index' %}">Defeat Academy</a></h1>

{% if user.is_authenticated %}
    <h2>Hello, {{ user.username }}.</h2>


<form action="{% url 'users:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

{% else %}
    <h2><a href="{% url 'users:register' %}">Register</a></h2>
    <h2><a href="{% url 'users:login' %}">Log in</a></h2>
{% endif %}

<p>Платформа для навчання</p>
<a href="{% url 'academy:courses' %}">Courses</a>

{% block content %}

{% endblock content %}
