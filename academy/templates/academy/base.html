<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defeat Academy</title>
    <style>
        /* --- ЗАГАЛЬНІ СТИЛІ --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9; /* Світло-сірий фон */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- НАВІГАЦІЯ (ВЕРХНЯ ПАНЕЛЬ) --- */
        header {
            background-color: #2c3e50; /* Темно-синій */
            color: white;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo a {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #3498db; /* Блакитний при наведенні */
        }

        /* Стиль для кнопки виходу, щоб виглядала як посилання */
        .logout-btn {
            background: none;
            border: 1px solid #ecf0f1;
            color: #ecf0f1;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: #e74c3c; /* Червоний при наведенні */
            border-color: #e74c3c;
            color: white;
        }

        /* --- ОСНОВНИЙ КОНТЕНТ --- */
        .main-container {
            flex: 1; /* Розтягує блок на всю висоту */
            max-width: 1000px;
            width: 100%;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            box-sizing: border-box; /* Щоб padding не ламав ширину */
        }

        /* --- ПІДВАЛ (FOOTER) --- */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: #bdc3c7;
            font-size: 0.9rem;
            margin-top: auto; /* Притискає футер до низу */
        }

        /* --- ЗАГОЛОВКИ ТА ПОСИЛАННЯ В ТЕКСТІ --- */
        h1, h2, h3 {
            color: #2c3e50;
        }

        a {
            color: #2980b9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <a href="{% url 'academy:index' %}">🛡️ Defeat Academy</a>
            </div>

            <div class="nav-links">
                <a href="{% url 'academy:courses' %}">Всі курси</a>

                {% if user.is_authenticated %}
                    <span style="color: #bdc3c7;">Вітаю, {{ user.username }}</span>

                    <a href="{% url 'academy:profile' %}">👤 Профіль</a>

                    <form action="{% url 'users:logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="logout-btn">Вийти</button>
                    </form>
                {% else %}
                    <a href="{% url 'users:login' %}">Увійти</a>
                    <a href="{% url 'users:register' %}" style="background: #27ae60; padding: 5px 15px; border-radius: 4px; color: white;">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </header>

    <div class="main-container">
        {% block content %}
        {% endblock content %}
    </div>

    <footer>
        <p>&copy; 2025 Defeat Academy. Платформа для навчання.</p>
    </footer>

</body>
</html>
